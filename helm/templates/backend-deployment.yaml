apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "status-tacos.fullname" . }}-backend
  labels:
    {{- include "status-tacos.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "status-tacos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "status-tacos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "status-tacos.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: "-Xmx1536m -Xms768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MaxMetaspaceSize=256m -Xss512k"
            - name: DB_HOST
              value: {{ .Values.database.host }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "status-tacos.fullname" . }}-database-secret
                  key: database-password
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.backend.env.springProfilesActive }}
            - name: MONITOR_EMAIL_ENABLED
              value: {{ .Values.backend.email.enabled | quote }}
            - name: MONITOR_EMAIL_SMTP_HOST
              value: {{ .Values.backend.email.smtp.host | quote }}
            - name: MONITOR_EMAIL_SMTP_PORT
              value: {{ .Values.backend.email.smtp.port | quote }}
            - name: MONITOR_EMAIL_SMTP_USERNAME
              value: {{ .Values.backend.email.smtp.username | quote }}
            - name: MONITOR_EMAIL_SMTP_PASSWORD
              value: {{ .Values.backend.email.smtp.password | quote }}
            - name: MONITOR_EMAIL_SMTP_AUTH
              value: {{ .Values.backend.email.smtp.auth | quote }}
            - name: MONITOR_EMAIL_SMTP_STARTTLS_ENABLE
              value: {{ .Values.backend.email.smtp.starttls.enable | quote }}
            - name: MONITOR_EMAIL_SMTP_STARTTLS_REQUIRED
              value: {{ .Values.backend.email.smtp.starttls.required | quote }}
            - name: MONITOR_EMAIL_FROM
              value: {{ .Values.backend.email.from | quote }}
            - name: MONITOR_EMAIL_SUBJECT_PREFIX
              value: {{ .Values.backend.email.subjectPrefix | quote }}
            - name: MONITOR_APP_URL
              value: {{ .Values.backend.appUrl | default (printf "https://%s" (index .Values.ingress.hosts 0).host) | quote }}
            - name: MONITOR_APNS_ENABLED
              value: {{ .Values.backend.apns.enabled | quote }}
            {{- if .Values.backend.apns.enabled }}
            - name: MONITOR_APNS_TEAM_ID
              value: {{ required "backend.apns.teamId is required" .Values.backend.apns.teamId | quote }}
            - name: MONITOR_APNS_KEY_ID
              value: {{ required "backend.apns.keyId is required" .Values.backend.apns.keyId | quote }}
            - name: MONITOR_APNS_BUNDLE_ID
              value: {{ .Values.backend.apns.bundleId | quote }}
            - name: MONITOR_APNS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "status-tacos.fullname" . }}-apns-secret
                  key: private-key
            {{- end }}
            - name: MONITOR_KEYCLOAKADMIN_ENABLED
              value: {{ .Values.backend.keycloakAdmin.enabled | quote }}
            {{- if .Values.backend.keycloakAdmin.enabled }}
            - name: MONITOR_KEYCLOAKADMIN_BASEURL
              value: {{ required "backend.keycloakAdmin.baseUrl is required" .Values.backend.keycloakAdmin.baseUrl | quote }}
            - name: MONITOR_KEYCLOAKADMIN_REALM
              value: {{ required "backend.keycloakAdmin.realm is required" .Values.backend.keycloakAdmin.realm | quote }}
            - name: MONITOR_KEYCLOAKADMIN_CLIENTID
              value: {{ required "backend.keycloakAdmin.clientId is required" .Values.backend.keycloakAdmin.clientId | quote }}
            - name: MONITOR_KEYCLOAKADMIN_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "status-tacos.fullname" . }}-keycloak-admin-secret
                  key: client-secret
            {{- end }}
            - name: MONITOR_APPLESIGNIN_ENABLED
              value: {{ .Values.backend.appleSignIn.enabled | quote }}
            {{- if .Values.backend.appleSignIn.enabled }}
            - name: MONITOR_APPLESIGNIN_IDENTITYPROVIDERALIAS
              value: {{ .Values.backend.appleSignIn.identityProviderAlias | quote }}
            - name: MONITOR_APPLESIGNIN_CLIENTID
              value: {{ required "backend.appleSignIn.clientId is required" .Values.backend.appleSignIn.clientId | quote }}
            - name: MONITOR_APPLESIGNIN_TEAMID
              value: {{ required "backend.appleSignIn.teamId is required" .Values.backend.appleSignIn.teamId | quote }}
            - name: MONITOR_APPLESIGNIN_KEYID
              value: {{ required "backend.appleSignIn.keyId is required" .Values.backend.appleSignIn.keyId | quote }}
            - name: MONITOR_APPLESIGNIN_PRIVATEKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "status-tacos.fullname" . }}-apple-signin-secret
                  key: private-key
            {{- end }}
          {{- if .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
