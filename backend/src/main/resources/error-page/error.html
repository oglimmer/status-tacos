<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#33ada4">
<title>{{status}} · {{title}} · Status Tacos</title>
<style>
/* Same look as the static error pages of the frontend (frontend/errors/). Self-contained: no
   fonts or images from outside, so it works under the strict CSP of the public status page. */
* { box-sizing: border-box; }
body {
  --agua: #e9f2ee; --paper: #f8fbf9; --teal: #33ada4; --ink: #102e2a; --ink-soft: #3d5a55;
  --masa: #f2b53c; --line: 2px solid var(--ink);
  --sign: 'Bungee', 'Arial Black', 'Helvetica Neue', sans-serif;
  --text: 'Atkinson Hyperlegible Next', system-ui, sans-serif;
  --gutter: clamp(1rem, 4vw, 3rem);
  --width: min(48rem, 100% - 2 * var(--gutter));
  margin: 0; min-height: 100vh; background: var(--agua); color: var(--ink);
  font-family: var(--text); font-size: 1.125rem; line-height: 1.55;
}
.band { background: var(--teal); padding: 1rem 0 6rem; }
.bar, .head { width: var(--width); margin: 0 auto; }
.brand {
  display: inline-flex; align-items: center; gap: 0.6rem;
  font-family: var(--sign); font-weight: 900; font-size: 1.05rem; text-transform: uppercase; color: var(--ink); text-decoration: none;
}
.brand-mark {
  display: inline-grid; place-items: center; width: 2.5rem; height: 2.5rem;
  border: var(--line); border-radius: 0.6rem; background: var(--masa); font-size: 0.85rem;
}
.head { padding-top: clamp(2.5rem, 7vw, 4.5rem); }
.code {
  margin: 0 0 0.5rem; font-family: var(--sign); font-weight: 900;
  font-size: clamp(4rem, 16vw, 9rem); line-height: 0.9;
  color: var(--paper); text-shadow: 0.05em 0.05em 0 var(--ink);
}
h1 {
  margin: 0; font-family: var(--sign); font-weight: 900;
  font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1; text-transform: uppercase; text-shadow: 0.06em 0.06em 0 var(--masa);
}
.sheet {
  width: var(--width); margin: -3.5rem auto 4rem; padding: clamp(1.5rem, 4vw, 3rem);
  background: var(--paper); border: var(--line); border-radius: 1rem;
}
.message { margin: 0 0 1.5rem; font-size: 1.2rem; }
.button {
  display: inline-block; padding: 0.7rem 1.3rem; background: var(--masa); color: var(--ink);
  border: var(--line); border-radius: 0.6rem; box-shadow: 0.2rem 0.2rem 0 var(--ink);
  font-weight: 800; text-decoration: none;
}
.button:hover { transform: translate(-1px, -1px); box-shadow: 0.3rem 0.3rem 0 var(--ink); }
a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <section class="band">
    <header class="bar">
      <a href="/" class="brand"><span class="brand-mark" aria-hidden="true">ST</span>Status Tacos</a>
    </header>
    <div class="head">
      <p class="code">{{status}}</p>
      <h1>{{title}}</h1>
    </div>
  </section>
  <div class="sheet">
    <p class="message">{{message}}</p>
    <a href="/" class="button">Go to the start page</a>
  </div>
</main>
</body>
</html>
