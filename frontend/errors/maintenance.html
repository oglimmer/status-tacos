<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#33ada4">
    <title>503 · Back in a minute · Status Tacos</title>
    <link rel="stylesheet" href="./errors.css">
  </head>
  <body>
    <main class="error-page tacos-page">
      <section class="error-band">
        <header class="error-bar">
          <a href="/" class="tacos-brand">
            <img src="../src/assets/logo.png" alt="">
            Status Tacos
          </a>
        </header>
        <div class="error-head">
          <p class="error-code">503</p>
          <h1 class="error-title">Back in a minute</h1>
        </div>
      </section>
      <div class="error-sheet">
        <img src="../src/assets/taco.webp" alt="" class="error-taco" width="640" height="441">
        <p class="error-message">Status Tacos gets an update right now. Please come back soon.</p>
        <a href="/" class="error-button">Try again</a>
      </div>
    </main>
  </body>
</html>
