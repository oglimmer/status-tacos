<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#33ada4">
    <title>500 · The kitchen is on fire · Status Tacos</title>

        <img src="../src/assets/taco.webp" alt="" class="error-taco" width="640" height="441">

        <a href="/" class="error-button">Try again</a>
