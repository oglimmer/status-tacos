<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Tacos</title>
    <meta name="description" content="Status Tacos checks your URLs every 15 seconds and alerts you by email, webhook, Microsoft Teams or iPhone when one goes down.">
    <meta name="theme-color" content="#33ada4">
    <script>
      // Apply the saved theme before the first paint. Same key as src/services/theme.ts.
      try {
        var t = localStorage.getItem('status-tacos-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
